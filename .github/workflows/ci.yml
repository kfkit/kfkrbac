name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Does the pull request touch more than documents? If not, the broker and
  # cluster suites do not run: they would test the same jar as on main. The
  # check and the documents' suite always run, the latter because it runs
  # the commands of docs/. Documents are *.md, docs/, LICENSE, NOTICE and the
  # issue templates. A push to main runs everything, and so does a change
  # this job could not judge: the conditions below read "not false".
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: changes
        run: |
          code=true
          # A pull request is checked out as its merge into the base
          # branch: the first parent is the base.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && paths=$(git diff --name-only HEAD^1 HEAD) && [ -n "$paths" ]; then
            if ! printf '%s\n' "$paths" | grep -qvE '(\.md$|^docs/|^LICENSE$|^NOTICE$|^\.github/ISSUE_TEMPLATE/)'; then
              code=false
            fi
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # The job name is what the ruleset requires; keep it stable.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests/

  # The built jar as the authorizer of a real broker, and as the extension of
  # two Connect workers that use it, one job per supported release: the
  # three the project supports and the one the jar is compiled against
  # (kafkaVersion in build.gradle.kts). The job names are what the
  # ruleset requires; keep them stable. For a pull request of documents
  # only, each job of the matrix still runs and reports under its name, with
  # its steps skipped: a job skipped as a whole would not report one check
  # per release.
  integration:
    name: integration (${{ matrix.kafka }})
    needs: [check, changes]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kafka: ["4.1.2", "4.2.2", "4.3.1", "4.4.0"]
    env:
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - if: env.CODE != 'false'
        uses: actions/checkout@v7
      - if: env.CODE != 'false'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - if: env.CODE != 'false'
        uses: gradle/actions/setup-gradle@v6
      - if: env.CODE != 'false'
        run: ./gradlew integrationTest --tests '*BrokerIT' --tests '*ConnectIT' -PbrokerVersion=${{ matrix.kafka }} --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports-${{ matrix.kafka }}
          path: |
            build/reports/tests/
            build/integration-logs/

  # The same on a cluster of several nodes, a controller and brokers in
  # containers of their own, of the newest release.
  integration-cluster:
    name: integration (cluster)
    needs: [check, changes]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew integrationTest --tests '*ClusterIT' --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports-cluster
          path: |
            build/reports/tests/
            build/integration-logs/

  # The shell commands of the pages of docs/, run as the pages have them in
  # the container of a broker of the newest release, those of
  # docs/connect.md with a Connect worker next to it, and their output
  # compared with the pages'.
  integration-docs:
    name: integration (docs)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew integrationTest --tests '*DocsIT' --no-daemon
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports-docs
          path: |
            build/reports/tests/
            build/integration-logs/
